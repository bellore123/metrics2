{% extends "base.html" %}
{% block title %}Check your email | Hostel Room Cleaning{% endblock %}
{% block content %}
<main class="auth-form-panel" style="min-height: 100vh">
    <section class="auth-card">
        <p class="eyebrow">EMAIL SENT</p>
        <h1>Check your inbox</h1>
        <p class="muted">If an active account exists for that email, a password-reset link has been sent. Also check your spam folder.</p>
        <a class="auth-back" href="{% url 'login' %}">← Back to sign in</a>
    </section>
</main>
{% endblock %}
