{% extends "portal/base.html" %}

{% block title %}Add Cleaner{% endblock %}
{% block page_title %}Add Cleaner{% endblock %}
{% block nav_cleaners %}active{% endblock %}

{% block content %}
<div class="portal-page">
    <div class="back-link">
        <a href="{% url 'portal:portal_cleaners' %}">← Back to Cleaners</a>
    </div>

    <div class="form-card">
        <div class="form-card-header">Create Cleaner Account</div>

        <form method="post" class="portal-form">
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group">
                    <label for="cleaner-name">Full Name *</label>
                    <input
                        type="text"
                        id="cleaner-name"
                        name="name"
                        class="form-input"
                        required
                        placeholder="e.g. Rajan Kumar"
                    >
                </div>

                <div class="form-group">
                    <label for="cleaner-employee-id">Employee ID *</label>
                    <input
                        type="text"
                        id="cleaner-employee-id"
                        name="employee_id"
                        class="form-input"
                        required
                        placeholder="e.g. CLN001"
                    >
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cleaner-phone">Phone Number</label>
                    <input
                        type="text"
                        id="cleaner-phone"
                        name="phone"
                        class="form-input"
                        placeholder="10-digit mobile number"
                    >
                    <small class="form-hint">Phone or email is required</small>
                </div>

                <div class="form-group">
                    <label for="cleaner-email">Email (optional)</label>
                    <input
                        type="email"
                        id="cleaner-email"
                        name="email"
                        class="form-input"
                        placeholder="cleaner@gmail.com"
                    >
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cleaner-password">Password *</label>
                    <input
                        type="password"
                        id="cleaner-password"
                        name="password"
                        class="form-input"
                        required
                        minlength="6"
                    >
                </div>

                <div class="form-group">
                    <label for="cleaner-assigned-block">Assigned Block</label>
                    <select
                        id="cleaner-assigned-block"
                        name="assigned_block"
                        class="form-input"
                    >
                        <option value="">— Select Block —</option>
                        {% for val, label in block_choices %}
                        <option value="{{ val }}">{{ val }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Create Cleaner
                </button>
                <a href="{% url 'portal:portal_cleaners' %}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
