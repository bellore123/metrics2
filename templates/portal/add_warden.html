{% extends "portal/base.html" %}

{% block title %}Add Warden{% endblock %}
{% block page_title %}Add Warden{% endblock %}
{% block nav_wardens %}active{% endblock %}

{% block content %}
<div class="portal-page">
    <div class="back-link"><a href="{% url 'portal:portal_wardens' %}">← Back to Wardens</a></div>

    <div class="form-card">
        <div class="form-card-header">Create Warden Account</div>
        <form method="post" class="portal-form">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="name" class="form-input" required placeholder="e.g. Dr. Anitha Kumar">
                </div>
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" name="email" class="form-input" required placeholder="e.g. cleanstay.warden.mha@gmail.com">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" name="password" class="form-input" required minlength="8">
                </div>
                <div class="form-group">
                    <label>Employee ID *</label>
                    <input type="text" name="employee_id" class="form-input" required placeholder="e.g. WRD001">
                </div>
            </div>
            <div class="form-group">
                <label>Assigned Block</label>
                <select name="assigned_block" class="form-input">
                    <option value="">— Select Block —</option>
                    {% for val, label in block_choices %}
                    <option value="{{ val }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Warden</button>
                <a href="{% url 'portal:portal_wardens' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
