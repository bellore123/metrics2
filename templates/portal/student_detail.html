    <form method="get" class="filter-bar filter-bar-wrap">
        <label for="complaint-search" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;">Search requests</label>
        <input type="text" id="complaint-search" name="q" value="{{ query }}" placeholder="Search student, reg no, room, description…" class="filter-input">

        <label for="complaint-status" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;">Filter by status</label>
        <select id="complaint-status" name="status" class="filter-select">
            <option value="">All Status</option>
            {% for val, label in status_choices %}
            <option value="{{ val }}" {% if status_filter == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>

        <label for="complaint-block" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;">Filter by block</label>
        <select id="complaint-block" name="block" class="filter-select">
            <option value="">All Blocks</option>
            {% for val, label in block_choices %}
            <option value="{{ val }}" {% if block_filter == val %}selected{% endif %}>{{ val }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn-filter">Filter</button>
        {% if query or status_filter or block_filter %}
        <a href="{% url 'portal:portal_complaints' %}" class="btn-clear">Clear</a>
        {% endif %}
    </form>
